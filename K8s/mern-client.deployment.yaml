apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-client
  labels:
    app: mern-client
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mern-client
  template:
    metadata:
      labels:
        app: mern-client
    spec:
      containers:
      - name: mern-client-container
        image: 139156132664.dkr.ecr.us-east-1.amazonaws.com/mern-estate-repo:client-latest
        ports:
        - containerPort: 5173
        readinessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m" 